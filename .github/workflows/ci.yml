name: CI
on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: make build
            - uses: actions/upload-artifact@v4
              with: { name: binaries, path: binaries/ }

    test:
            needs: build
            runs-on: ubuntu-latest
            steps:
                - uses: actions/download-artifact@v4
                - run: make test
            
    deploy:
            needs: test
            runs-on: ubuntu-latest
            steps:
                - run: ./deploy.sh